# Backbone screening at 224: BioCLIP ViT-B/16 (TreeOfLife-10M, arXiv 2311.18803). Zero-shot head built as BioCLIP's own
# (80 OpenAI templates over taxonomic + common names, github.com/Imageomics/bioclip-2
# src/evaluation/zero_shot_iid.py); neither BioCLIP paper fine-tunes, so the CLIP recipe.
# Pretraining data has no WCS/LILA sources; ToL-200M was PDQ-deduplicated against the
# WILDS iWildCam test split.

split: official_ood
seed: 0

model: bioclip
pretrained: true
model_kwargs:
  zeroshot_head: true
  quick_gelu: true           # trained from OpenAI CLIP (QuickGELU); hub config omits it, -5 F1 zero-shot
  text_type: taxon_common    # "Animalia Chordata ... Aepyceros melampus with common name impala"

lr: 0.00001                  # 1e-5; 1e-4 on a CLIP backbone costs OOD accuracy (WiSE-FT sec. 4)
weight_decay: 0.1
lr_schedule: cosine
warmup_steps: 500
grad_clip: 1.0

min_per_camera: 10
min_cameras: 5

size: 224
height: 224
image_dir: null
epochs: 10                    # as fast.yaml, so the ResNet rows compare directly
batch_size: 128

amp: true
num_workers: 8
device: null
verbose: true
pred_dir: results/preds
log_dir: logs

wandb: false
wandb_project: ai4good-iwildcam
