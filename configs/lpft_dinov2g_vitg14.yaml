# LP-FT on DINOv2 ViT-g/14 with registers (1.1B params), same recipe as lpft_dinov2_vitl14.yaml.
# Gradient checkpointing so batch 128 fits in 46 GB.

split: official_ood
seed: 0

model: vit_giant_patch14_reg4_dinov2.lvd142m
pretrained: true
model_kwargs:
  img_size: 224              # timm resamples the 518px position embedding once at load

lr: 0.00001                  # one lr for backbone and probe head, as LP-FT
weight_decay: 0.05
wd_skip_1d: true
lp_init: true               # LP stage before fine-tuning
lr_schedule: cosine
warmup_steps: 500
grad_clip: 1.0
grad_checkpointing: true    # no effect on results

min_per_camera: 10
min_cameras: 5

size: 224
height: 224
image_dir: null
epochs: 10                    # as fast.yaml, so the ResNet rows compare directly
batch_size: 128

amp: true
num_workers: 8
device: null
verbose: true
pred_dir: results/preds
log_dir: logs

wandb: false
wandb_project: ai4good-iwildcam
