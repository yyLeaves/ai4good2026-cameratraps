# Backbone screening at 224: BioCLIP 2.5 ViT-H/14 (huggingface.co/imageomics/bioclip-2.5-vith14),
# same as screen_bioclip2_vitl14.yaml. Initialised from LAION-2B ViT-H/14, so plain GELU.
# Pretraining data: the updated TreeOfLife-200M (no WCS/LILA publishers).

split: official_ood
seed: 0

model: bioclip-2.5
pretrained: true
model_kwargs:
  zeroshot_head: true
  text_type: taxon_common    # "Animalia Chordata ... Aepyceros melampus with common name impala"

lr: 0.00001                  # 1e-5; 1e-4 on a CLIP backbone costs OOD accuracy (WiSE-FT sec. 4)
weight_decay: 0.1
lr_schedule: cosine
warmup_steps: 500
grad_clip: 1.0
grad_checkpointing: true    # ViT-H at batch 128 does not fit otherwise; no effect on results

min_per_camera: 10
min_cameras: 5

size: 224
height: 224
image_dir: null
epochs: 10                    # as fast.yaml, so the ResNet rows compare directly
batch_size: 128

amp: true
num_workers: 8
device: null
verbose: true
pred_dir: results/preds
log_dir: logs

wandb: false
wandb_project: ai4good-iwildcam
